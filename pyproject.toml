[build-system]
requires = ["scikit-build-core>=0.3.3", "nanobind>=1.4.0"]
build-backend = "scikit_build_core.build"


[project]
name = "liburlparser"
dynamic = ["version"]
description = "Fastest Url parser in the world"
readme = "README.md"
authors = [
  { name = "Mohammad Raziei", email = "mohammadraziei1375@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
[project.optional-dependencies]
test = ["pytest-xdist"]

[project.urls]
"Homepage" = "https://github.com/mohammadraziei/liburlparser"
"Bug Tracker" = "https://github.com/mohammadraziei/liburlparser/issues"
"Document" = "https://mohammadraziei.github.io/liburlparser/latest"

[tool.cibuildwheel]
# No more split-mode STABLE_ABI, so no single abi3 wheel covers every
# Python. 3.10/3.11: normal per-version build (nanobind's linked-mode
# STABLE_ABI has no effect below 3.12, per CMakeLists.txt). 3.12: built
# once and tagged cp312-abi3 via SKBUILD_WHEEL_PY_API (set per-build in
# .github/workflows, see ctoon for the same pattern) - that single wheel
# covers every newer interpreter too.
build = ["cp310-*", "cp311-*", "cp312-*"]
test-command = "pytest {project}/tests -k \"not test_cli_subprocess\""
test-extras = ["test"]
test-skip = ["*universal2:arm64"]
# build-verbosity = 1

# Configuration for Cross-Platform Build
[tool.scikit-build]
# Ensure we see output if something fails
build.verbose = true
# Minimum CMake version check
cmake.version = ">=3.15"

# Ensure that the Python package installed is the optimized version, not the Debug version.
cmake.args = [
    "-DCMAKE_BUILD_TYPE=Release"
]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "include/urlparser.h"
regex = '''(?sx)
\#define \s+ URLPARSER_VERSION_MAJOR \s+ (?P<major>\d+) .*?
\#define \s+ URLPARSER_VERSION_MINOR \s+ (?P<minor>\d+) .*?
\#define \s+ URLPARSER_VERSION_PATCH \s+ (?P<patch>\d+) .*?
'''
result = "{major}.{minor}.{patch}"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
# Registered explicitly so --strict-markers doesn't reject test_memory.py's
# collection when pytest-memray isn't installed (it's an optional extra,
# see test-extras/CIBW config below - memray has no Windows support, and
# even elsewhere the marker is normally auto-registered by the plugin
# itself, which isn't guaranteed to be present at test-collection time).
# Without the plugin the mark is simply inert - no leak checking happens,
# same as running pytest without --memray.
markers = [
    "limit_leaks(*args, **kwargs): fail if net allocations inside the marked test exceed a threshold (pytest-memray)",
]
filterwarnings = [
    "error",
    "ignore:(ast.Str|Attribute s|ast.NameConstant|ast.Num) is deprecated:DeprecationWarning:_pytest",  # Python 3.12
]
testpaths = ["tests/python"]

[tool.ruff]
target-version = "py38"
src = ["src"]

# [tool.ruff.lint]
select = [
   "E", "F", "W", # flake8
   "B",           # flake8-bugbear
   "I",           # isort
   "ARG",         # flake8-unused-arguments
   "C4",          # flake8-comprehensions
   "EM",          # flake8-errmsg
   "ICN",         # flake8-import-conventions
   "ISC",         # flake8-implicit-str-concat
   "G",           # flake8-logging-format
   "PGH",         # pygrep-hooks
   "PIE",         # flake8-pie
   "PL",          # pylint
   "PT",          # flake8-pytest-style
   "PTH",         # flake8-use-pathlib
   "RET",         # flake8-return
   "RUF",         # Ruff-specific
   "SIM",         # flake8-simplify
   "T20",         # flake8-print
   "UP",          # pyupgrade
   "YTT",         # flake8-2020
   "NPY",         # NumPy specific rules
   "PD",          # pandas-vet
]
extend-ignore = [
   "PLR",    # Design related pylint codes
   "E501",   # Line too long
]
unfixable = [
   "T20",  # Removes print statements
   "F841", # Removes unused variables
]
flake8-unused-arguments.ignore-variadic-names = true
isort.required-imports = ["from __future__ import annotations"]
exclude = ["third_party", "tests/utest"]

[tool.ruff.per-file-ignores]
"tests/**" = ["F841", "ARG001", "PT004"]
"src/**/__main__.py" = ["T20", "ARG001"]
"src/**/core.py" = ["ARG001", "F401"]
